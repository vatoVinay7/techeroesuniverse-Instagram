name: Medien bereitstellen

# Baut die GitHub-Pages-Seite, von der Instagram die Videos und Bilder der Woche lädt.
# Läuft, wenn sich ein Wochenplan ändert, auf Knopfdruck und jede Nacht (räumt alte Wochen ab).
on:
  push:
    branches: [main]
    paths:
      - "plans/**"
  workflow_dispatch:
  schedule:
    - cron: "40 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Medien der offenen Wochen laden
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m igpost build-site _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
