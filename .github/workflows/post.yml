name: Posten

# Alle 15 Minuten nachsehen, ob ein freigegebener Reel oder eine Story fällig ist.
# GitHub startet geplante Läufe manchmal ein paar Minuten später – das ist eingeplant.
# Läuft der Zeitplan nicht an: Actions → „Posten“ → „Run workflow“ (postet alles Fällige).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Immer den NEUESTEN Stand von main holen, nicht den Commit, der beim Start aktuell war:
      # Laufen zwei Läufe kurz nacheinander, sieht der zweite sonst ein veraltetes
      # state/posted.json und postet dasselbe noch einmal (passiert am 25.11.).
      # Die concurrency-Gruppe sorgt dafür, dass der zweite erst nach dem Push des ersten startet.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fällige Posts veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m igpost post

      - name: Protokoll speichern
        if: always()
        run: bash scripts/commit-state.sh "Posting-Protokoll"
