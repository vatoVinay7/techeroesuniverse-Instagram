name: Posten

# Alle 15 Minuten nachsehen, ob ein freigegebener Reel oder eine Story fällig ist.
# GitHub startet geplante Läufe manchmal ein paar Minuten später – das ist eingeplant.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fällige Posts veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m igpost post

      - name: Protokoll speichern
        if: always()
        run: bash scripts/commit-state.sh "Posting-Protokoll"
