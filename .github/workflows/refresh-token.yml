name: Token erneuern

# Instagram-Token laufen nach 60 Tagen ab. Einmal pro Woche erneuern.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Sofort erneuern (auch wenn noch nicht nötig)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-state
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Token prüfen und erneuern
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m igpost refresh-token ${{ inputs.force && '--force' || '' }}

      - name: Verschlüsselten Token speichern
        if: always()
        run: bash scripts/commit-state.sh "Instagram-Token erneuert"
